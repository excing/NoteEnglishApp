name: Build and Release Multi-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag name (optional, e.g. v1.0.0; if provided, creates GitHub Release)'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  # ============================================================================
  # 1. 静态检查与自动化测试
  # ============================================================================
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: note_english_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Run Unit & Contract Tests
        run: flutter test

  # ============================================================================
  # 2. 移动端 - Android 构建 (APK & AAB)
  # ============================================================================
  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: note_english_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Keystore (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided. Falling back to debug keys for release build."
          fi

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release AAB)
        run: flutter build appbundle --release

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/NoteEnglishApp-Android-release.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/NoteEnglishApp-Android-release.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: note_english_flutter/artifacts/*

  # ============================================================================
  # 3. 移动端 - iOS 构建 (Unsigned IPA & Runner.app)
  # ============================================================================
  build-ios:
    name: Build iOS
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: note_english_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA & Zip
        run: |
          mkdir -p artifacts
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q artifacts/NoteEnglishApp-iOS-unsigned.ipa Payload
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app artifacts/NoteEnglishApp-iOS-Runner.app.zip

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          path: note_english_flutter/artifacts/*

  # ============================================================================
  # 4. 桌面端 - macOS 构建 (DMG & Zip)
  # ============================================================================
  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: note_english_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS (Release)
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          mkdir -p artifacts
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build/macos/Build/Products/Release"
            exit 1
          fi
          echo "Found macOS App: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/NoteEnglishApp-macOS.zip
          
          # 创建包含 Applications 快捷方式软链接的标准 DMG 结构
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "NoteEnglish" -srcfolder dmg_staging -ov -format UDZO artifacts/NoteEnglishApp-macOS.dmg
          rm -rf dmg_staging

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: note_english_flutter/artifacts/*

  # ============================================================================
  # 5. 桌面端 - Windows 构建 (Zip)
  # ============================================================================
  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: note_english_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath artifacts\NoteEnglishApp-Windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: note_english_flutter/artifacts/*

  # ============================================================================
  # 6. 桌面端 - Linux 构建 (Tar.gz)
  # ============================================================================
  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: note_english_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux (Release)
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          mkdir -p artifacts
          tar -czf artifacts/NoteEnglishApp-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: note_english_flutter/artifacts/*

  # ============================================================================
  # 7. Web 端构建 (Zip)
  # ============================================================================
  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: note_english_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web (Release)
        run: flutter build web --release

      - name: Package Web App
        run: |
          mkdir -p artifacts
          zip -r -q artifacts/NoteEnglishApp-Web.zip build/web

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-packages
          path: note_english_flutter/artifacts/*

  # ============================================================================
  # 8. GitHub Release 发布 (Tag 推送或指定 release_tag 手动触发时执行)
  # ============================================================================
  release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios
      - build-macos
      - build-windows
      - build-linux
      - build-web
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten Artifact Files
        run: |
          mkdir -p final-assets
          find release-assets -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: ${{ github.event.inputs.draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == true }}
          files: final-assets/*
          generate_release_notes: true
